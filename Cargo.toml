[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Ujap1994/ElectronicWerk"
authors = ["ElectronicWerk contributors"]

[workspace.dependencies]
ew-core = { path = "crates/ew-core" }
clap = { version = "4.6", features = ["derive"] }
napi = { version = "3.16", default-features = false, features = ["napi6"] }
napi-build = "2.6"
napi-derive = "3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
