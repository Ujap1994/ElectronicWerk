[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Ujap1994/ElectronicWerk"
authors = ["ElectronicWerk contributors"]

[workspace.dependencies]
ew-core = { path = "crates/ew-core" }
ew-format = { path = "crates/ew-format" }
ew-kicad = { path = "crates/ew-kicad" }
ew-library = { path = "crates/ew-library" }
ew-model = { path = "crates/ew-model" }
ew-scene = { path = "crates/ew-scene" }
ew-synth = { path = "crates/ew-synth" }
clap = { version = "4.6", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
earcut = "0.4"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
napi = { version = "3.16", default-features = false, features = ["napi6"] }
napi-build = "2.6"
napi-derive = "3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
rayon = "1.12"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
proptest = { version = "1.11", default-features = false, features = ["std"] }
tempfile = "3.27"
thiserror = "2.0"
uuid = { version = "1.29", features = ["v4", "serde"] }
zip = { version = "9.4", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
