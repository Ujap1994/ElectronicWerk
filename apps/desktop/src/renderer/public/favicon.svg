<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>ElectronicWerk</title>
  <!-- Master icon. Raster files are generated by scripts/generate-icons.mjs. -->
  <defs>
    <!-- Solder-mask green board -->
    <linearGradient id="mask" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0" stop-color="#17845f" />
      <stop offset="1" stop-color="#0b4a37" />
    </linearGradient>
    <!-- Copper traces and vias -->
    <linearGradient id="copper" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0" stop-color="#f2b27a" />
      <stop offset="0.55" stop-color="#d4823f" />
      <stop offset="1" stop-color="#a95a22" />
    </linearGradient>
  </defs>

  <!-- Board with a subtle edge highlight -->
  <rect width="1024" height="1024" rx="228" fill="url(#mask)" />
  <rect x="44" y="44" width="936" height="936" rx="190" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="6" />

  <!-- The letter E, routed as 45° copper traces -->
  <g fill="none" stroke="url(#copper)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700 268 H392 L330 330 V694 L392 756 H700" />
    <path d="M330 512 H620" />
  </g>

  <!-- Vias at the trace ends -->
  <g fill="url(#copper)">
    <circle cx="700" cy="268" r="60" />
    <circle cx="620" cy="512" r="60" />
    <circle cx="700" cy="756" r="60" />
  </g>
  <g fill="#0b4a37">
    <circle cx="700" cy="268" r="24" />
    <circle cx="620" cy="512" r="24" />
    <circle cx="700" cy="756" r="24" />
  </g>

  <!-- Silkscreen pin header -->
  <g fill="#ffffff" fill-opacity="0.85">
    <rect x="170" y="300" width="56" height="34" rx="8" />
    <rect x="170" y="384" width="56" height="34" rx="8" />
    <rect x="170" y="468" width="56" height="34" rx="8" />
    <rect x="170" y="552" width="56" height="34" rx="8" />
    <rect x="170" y="636" width="56" height="34" rx="8" />
    <rect x="170" y="720" width="56" height="34" rx="8" />
  </g>
</svg>
