# cargo-deny: license, advisory and source policy for Rust dependencies.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Only licenses that are actually in use; extend deliberately when a new
# dependency needs another permissive license.
# Zlib: foldhash (hash function of hashbrown, used by rusqlite), M4.
allow = ["MIT", "Apache-2.0", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
