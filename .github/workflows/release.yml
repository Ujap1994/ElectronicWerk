name: Release

# A version tag (v1.2.3) builds every package, smoke-tests it and publishes a
# GitHub release. A manual run builds everything and keeps the files as
# workflow artifacts; it only publishes when "publish" is ticked.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release (otherwise build and test only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LEFTHOOK: '0'

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag matches the version in every manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs check "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" --out release-notes.md
          else
            node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" --out release-notes.md --allow-unreleased
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            builder: --win --x64
            app: release/win-unpacked/ElectronicWerk.exe
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            builder: --win --arm64
            app: release/win-arm64-unpacked/ElectronicWerk.exe
          - name: macos
            os: macos-latest
            target: universal
            builder: --mac
            app: release/mac-universal/ElectronicWerk.app/Contents/MacOS/ElectronicWerk
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            builder: --linux --x64
            app: release/linux-unpacked/electronicwerk
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            builder: --linux --arm64
            app: release/linux-arm64-unpacked/electronicwerk
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - run: npm ci

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools ruby ruby-dev build-essential xvfb flatpak flatpak-builder squashfs-tools
          sudo gem install --no-document fpm
          # electron-builder's core24 snaps need snapcraft 8 (9 cannot find the desktop file).
          # The Snap Store is sometimes unreachable for a while: retry.
          for attempt in 1 2 3 4 5 6; do
            sudo snap install snapcraft --classic --channel=8.x/stable && break
            if [ "$attempt" = 6 ]; then exit 1; fi
            echo "Snap Store not reachable (attempt $attempt); retrying in 30 s."
            sleep 30
          done
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-ls --user flathub --all --columns=ref | grep -E 'Electron2.BaseApp|org.freedesktop.(Platform|Sdk)/' | grep -v -E 'Locale|Debug|Sources' | tail -n 12 || true
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08

      - name: Build native engine
        run: |
          if [ "${{ matrix.target }}" = universal ]; then
            node scripts/build-native.mjs --release --universal
          else
            node scripts/build-native.mjs --release --target ${{ matrix.target }}
          fi

      - name: Build app
        run: npm run build -w @electronicwerk/desktop

      - name: Package
        working-directory: apps/desktop
        env:
          USE_SYSTEM_FPM: 'true'
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: EW_USER_DATA_DIR="$(mktemp -d)" xvfb-run --auto-servernum "${{ matrix.app }}" --smoke-test --no-sandbox

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: EW_USER_DATA_DIR="$(mktemp -d)" "${{ matrix.app }}" --smoke-test

      - name: Smoke test (macOS universal, arm64, x64)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          for app in release/mac-universal release/mac-arm64; do
            EW_USER_DATA_DIR="$(mktemp -d)" "$app/ElectronicWerk.app/Contents/MacOS/ElectronicWerk" --smoke-test
          done
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            EW_USER_DATA_DIR="$(mktemp -d)" release/mac/ElectronicWerk.app/Contents/MacOS/ElectronicWerk --smoke-test
          else
            echo "Rosetta is not available; skipping the x64 smoke test."
          fi

      - name: Command-line tool
        run: |
          if [ "${{ matrix.target }}" = universal ]; then
            node scripts/package-cli.mjs --target aarch64-apple-darwin
            node scripts/package-cli.mjs --target x86_64-apple-darwin
          else
            node scripts/package-cli.mjs --target ${{ matrix.target }}
          fi

      - name: Collect packages
        working-directory: apps/desktop/release
        run: |
          mkdir -p ../dist
          shopt -s nullglob
          for file in *.exe *.dmg *.zip *.AppImage *.deb *.rpm *.pacman *.tar.gz *.snap *.flatpak; do
            # Uniform architecture names (deb says amd64, rpm/AppImage x86_64/aarch64).
            name="$(echo "$file" | sed -E 's/-linux-(amd64|x86_64)\./-linux-x64./; s/-linux-aarch64\./-linux-arm64./')"
            cp "$file" "../dist/$name"
          done
          ls -la ../dist

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.name }}
          path: apps/desktop/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ElectronicWerk $VERSION" \
            --notes-file release-notes.md
